name: Update market data

on:
  schedule:
    - cron: "17 14 * * *"
    - cron: "17 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests openpyxl

      - name: Fetch prices and rig count
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python fetch_data.py

      - name: Save
        run: |
          git config user.name "rigbuddy-data-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/market.json
          git commit -m "Market data $(date -u +%Y-%m-%dT%H:%MZ)" || echo "No changes"
          git push
